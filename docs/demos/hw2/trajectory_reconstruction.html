 for(let i=0;i<N;i+=dec){const px=PX(X[i]),py=PY(Y[i]);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
 ctx.stroke();
 const methods=method==='all'?['linear','quadratic','spline']:[method];
 const cols={linear:css('--blue'),quadratic:css('--purple'),spline:css('--green')};
 let stat='';
 const R0=recon(rate,methods[0]);
 for(const m of methods){const R=recon(rate,m);
  ctx.strokeStyle=cols[m];ctx.lineWidth=view==='full'?1.4:2;ctx.beginPath();
  for(let i=0;i<N;i++){const px=PX(R.rx[i]),py=PY(R.ry[i]);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.stroke()}
 // samples
 const idx=sampleIdx(rate);ctx.fillStyle=css('--amber');
 for(const i of idx){const px=PX(X[i]),py=PY(Y[i]);
  if(px<-10||px>W+10||py<-10||py>H+10)continue;
  ctx.beginPath();ctx.arc(px,py,view==='full'?2.6:4.2,0,7);ctx.fill()}
 // worst-error marker for the first selected method
 const mpx=PX(X[R0.am]),mpy=PY(Y[R0.am]);
 if(mpx>0&&mpx<W&&mpy>0&&mpy<H){ctx.strokeStyle=css('--red');ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(mpx,mpy,9,0,7);ctx.stroke()}
 // stats
 stat=methods.map(m=>{const R=recon(rate,m);
  return `<span style="color:${cols[m]};font-weight:600">${m}</span>: cum ${fm(R.cum)} m · mean ${R.mean.toFixed(3)} m · max ${fm(R.mx,2)} m at t = ${(R.am/30).toFixed(1)} s`}).join('<br>');
 document.getElementById('stats').innerHTML=`${recon(rate,methods[0]).ns} samples at ${rate===3?'10':rate===30?'1':'0.2'} Hz (ground truth: 2905 points at 30 Hz)<br>${stat}`;
 const caps={
  3:'At 10 Hz the samples are only 1–2 m apart, so all three methods land within centimetres of the truth — the red "worst spot" ring barely means anything. Method choice is nearly free here.',
  30:'At 1 Hz the differences appear exactly where the road bends. Linear (blue) cuts chords across every curve, the piecewise quadratic (purple) kinks where its parabola windows meet, and the spline (green) hugs the arc. The red ring marks the worst spot.',
  150:'At 0.2 Hz there is one sample every ~72 m of road. Whole corners fall between samples, so every method invents geometry — the spline swings smoothly through the wrong places, and the roundabout loop vanishes. No method can recover what was never sampled.'};
 document.getElementById('cap').textContent=caps[rate];
}
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;
 document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));draw()});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{method=b.dataset.m;
 document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));draw()});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;
 document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));draw()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
draw();
const post=()=>parent.postMessage({demoHeight:document.body.scrollHeight+8},'*');
addEventListener('load',post);new ResizeObserver(post).observe(document.body);
</script></body></html>

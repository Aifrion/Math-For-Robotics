<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cos Table Explorer</title>
<style>
:root{--text-primary:#1f2937;--text-secondary:#4b5563;--text-muted:#9ca3af;--text-success:#15803d;--text-danger:#b91c1c;--text-accent:#1d4ed8;--bg-accent:#dbeafe;--border:#e5e7eb;--border-strong:#cbd5e1;--border-accent:#93c5fd;--radius:8px;--bg:#ffffff;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--gray:#9ca3af}
@media (prefers-color-scheme:dark){:root{--text-primary:#e5e7eb;--text-secondary:#cbd5e1;--text-muted:#6b7280;--text-success:#4ade80;--text-danger:#f87171;--text-accent:#93c5fd;--bg-accent:#1e3a8a;--border:#2f2f2f;--border-strong:#4b5563;--border-accent:#3b82f6;--bg:#191919;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--gray:#6b7280}}
body{margin:0;padding:12px 16px;background:var(--bg);color:var(--text-primary);font:14px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:900px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.row button{font:inherit;font-size:13px;padding:4px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);cursor:pointer}
.row button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
input[type=range]{flex:1;min-width:150px}
#read{font-size:13.5px;margin:6px 0;font-variant-numeric:tabular-nums;line-height:1.7}
svg{display:block}
.cap{font-size:13px;color:var(--text-secondary);margin-top:4px}
</style></head><body>
<div class="row"><span style="font-size:13px">method</span>
 <button id="ml" class="on">linear</button><button id="mq">quadratic</button>
 <span style="font-size:13px;margin-left:10px">presets</span>
 <button onclick="setE(9)">9 entries</button>
 <button onclick="setE(41)">41 entries</button>
 <button id="p6">6-digit table</button></div>
<div class="row"><span style="font-size:13px">entries</span><input type="range" id="sl" min="0" max="100" step="1" value="20"><b id="ev" style="font-size:13px;min-width:46px"></b></div>
<div id="read"></div>
<svg id="sv" width="100%" viewBox="0 0 860 430"></svg>
<div class="cap" id="cap"></div>
<script>
let quad=false,E=9;
const PI=Math.PI,sv=document.getElementById('sv'),sl=document.getElementById('sl');
const fmt=n=>{if(n===0)return'0';const e=Math.floor(Math.log10(Math.abs(n)));
 return (n/10**e).toFixed(1).replace('-','−')+'·10'+String(e).replace('-','⁻').replace(/(\d)/g,m=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+m])};
function quadEval(xs,ys,x){const m=xs.length;let k=Math.min(m-3,Math.max(0,2*Math.floor((x/(xs[1]-xs[0]))/2)));
 const t0=xs[k],t1=xs[k+1],t2=xs[k+2],y0=ys[k],y1=ys[k+1],y2=ys[k+2];
 return y0*(x-t1)*(x-t2)/((t0-t1)*(t0-t2))+y1*(x-t0)*(x-t2)/((t1-t0)*(t1-t2))+y2*(x-t0)*(x-t1)/((t2-t0)*(t2-t1))}
function linEval(xs,ys,x){const h=xs[1]-xs[0];let k=Math.min(xs.length-2,Math.max(0,Math.floor(x/h)));
 const f=(x-xs[k])/h;return ys[k]+f*(ys[k+1]-ys[k])}
function t(x,y,s,o={}){return `<text x="${x}" y="${y}" style="font-size:${o.sz||12}px;fill:${o.c||'var(--text-secondary)'};font-weight:${o.w||400}" text-anchor="${o.a||'start'}">${s}</text>`}
const css=v=>`var(--${v})`;
function draw(){
 let m=E-1;if(quad&&m%2)m++;const ent=m+1,h=PI/m;
 document.getElementById('ev').textContent=ent;
 const xs=Array.from({length:ent},(_,i)=>i*h),ys=xs.map(Math.cos);
 const ev=quad?x=>quadEval(xs,ys,x):x=>linEval(xs,ys,x);
 // sample error densely
 const NS=Math.max(1200,4*m);let mx=0;const err=[];
 for(let i=0;i<=NS;i++){const x=i/NS*PI,e=ev(x)-Math.cos(x);err.push([x,e]);if(Math.abs(e)>mx)mx=Math.abs(e)}
 const bound=quad?h*h*h/(9*Math.sqrt(3)):h*h/8;
 // ---- top panel: cos + interpolant ----
 const L=46,W=800,T1=18,H1=180,T2=250,H2=160;
 const X=x=>L+x/PI*W,Y1=y=>T1+(1-y)/2*H1;
 let s='';
 s+=`<path d="M${L} ${Y1(0)}H${L+W}" stroke="var(--text-muted)" stroke-width="0.7"/>`;
 let d1='',d2='';
 for(let i=0;i<=400;i++){const x=i/400*PI;d1+=(i?'L':'M')+X(x).toFixed(1)+' '+Y1(Math.cos(x)).toFixed(1);
  d2+=(i?'L':'M')+X(x).toFixed(1)+' '+Y1(ev(x)).toFixed(1)}
 s+=`<path d="${d1}" stroke="var(--text-primary)" stroke-width="2.4" fill="none"/>`;
 s+=`<path d="${d2}" stroke="${quad?css('green'):css('blue')}" stroke-width="2" fill="none" stroke-dasharray="7 4"/>`;
 if(ent<=65)xs.forEach(x=>{s+=`<circle cx="${X(x)}" cy="${Y1(Math.cos(x))}" r="3.6" fill="${quad?css('green'):css('blue')}"/>`});
 s+=t(L+4,T1+H1-6,'cos x (solid) and the table interpolant (dashed)',{sz:12});
 s+=t(L,T1+H1+18,'0',{a:'middle'})+t(L+W/2,T1+H1+18,'π/2',{a:'middle'})+t(L+W,T1+H1+18,'π',{a:'middle'});
 // ---- bottom panel: error ----
 const sc=Math.max(mx,bound)*1.25||1e-9;
 const Y2=e=>T2+(1-e/sc)/2*H2;
 s+=`<path d="M${L} ${Y2(0)}H${L+W}" stroke="var(--text-muted)" stroke-width="0.7"/>`;
 s+=`<rect x="${L}" y="${Y2(bound)}" width="${W}" height="${Y2(-bound)-Y2(bound)}" fill="${quad?css('green'):css('blue')}" opacity="0.08"/>`;
 s+=`<path d="M${L} ${Y2(bound)}H${L+W}M${L} ${Y2(-bound)}H${L+W}" stroke="${quad?css('green'):css('blue')}" stroke-width="1" stroke-dasharray="5 4"/>`;
 let d3='';err.forEach(([x,e],i)=>{d3+=(i?'L':'M')+X(x).toFixed(1)+' '+Y2(e).toFixed(1)});
 s+=`<path d="${d3}" stroke="${css('red')}" stroke-width="1.8" fill="none"/>`;
 s+=t(L+4,T2-6,`error: interpolant − cos x  (axis ±${fmt(sc)})`,{sz:12});
 s+=t(L+W,Y2(bound)-5,`±bound ${fmt(bound)}`,{a:'end',sz:11,c:quad?css('green'):css('blue')});
 s+=t(L,T2+H2+18,'0',{a:'middle'})+t(L+W/2,T2+H2+18,'π/2',{a:'middle'})+t(L+W,T2+H2+18,'π',{a:'middle'});
 sv.innerHTML=s;
 const ok=mx<=5e-7;
 document.getElementById('read').innerHTML=
  `h = π/${m} = ${h.toFixed(6)} rad &nbsp;·&nbsp; measured max error = <b>${fmt(mx)}</b> &nbsp;≤&nbsp; bound ${quad?'h³/9√3':'h²/8'} = ${fmt(bound)} ✓<br>`+
  `6-digit target 5·10⁻⁷: <b style="color:${ok?'var(--text-success)':'var(--text-danger)'}">${ok?'✓ met':'✗ not yet'}</b> with ${ent} entries`;
 document.getElementById('cap').textContent=quad?
  'Quadratic: each parabola covers two intervals, so the error bound drops to h³/9√3 — one more order of h. Slide until the red curve fits inside the 5·10⁻⁷ target: 161 entries do it.'
  :'Linear: the error between nodes is at most h²/8 (the sagging-chord bound, since |cos″| ≤ 1). Watch the red bumps shrink 4× every time you halve h. Reaching 6 digits takes 1572 entries.';
}
function setE(e){E=e;sl.value=Math.round(100*Math.log(E/5)/Math.log(2000/5));draw()}
sl.oninput=()=>{E=Math.round(5*Math.pow(2000/5,sl.value/100));draw()};
document.getElementById('ml').onclick=()=>{quad=false;ml.classList.add('on');mq.classList.remove('on');draw()};
document.getElementById('mq').onclick=()=>{quad=true;mq.classList.add('on');ml.classList.remove('on');draw()};
document.getElementById('p6').onclick=()=>setE(quad?161:1572);
setE(9);
const post=()=>parent.postMessage({demoHeight:document.body.scrollHeight+8},'*');
addEventListener('load',post);new ResizeObserver(post).observe(document.body);
</script></body></html>

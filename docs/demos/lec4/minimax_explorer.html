<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimax Line Explorer</title>
<style>
:root{--bg:#fff;--fg:#1f2937;--mut:#6b7280;--grid:#e5e7eb;--card:#f9fafb}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e5e7eb;--mut:#9ca3af;--grid:#333;--card:#222}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.w{padding:12px 16px;max-width:900px}.r{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:3px 0}
input[type=range]{width:100%}button{border:1px solid var(--grid);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
.cv{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}canvas{flex:1 1 300px;min-width:0;width:100%;height:auto;border-radius:10px;background:var(--card)}
#s{font-weight:700;margin-top:8px}.h{color:var(--mut);font-size:12.5px;margin-top:6px}
</style></head><body><div class="w">
<div class="r"><span>a (height)</span><input type="range" id="a" min="0.6" max="1.8" step="0.0001" value="1"><span id="av"></span></div>
<div class="r"><span>b (slope)</span><input type="range" id="b" min="0.4" max="2" step="0.0001" value="1"><span id="bv"></span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button id="t">Taylor: 1 + x</button><button id="l">Least squares</button><button id="m">Minimax</button></div>
<div id="s"></div>
<div class="cv"><canvas id="c1" width="440" height="300"></canvas><canvas id="c2" width="440" height="300"></canvas></div>
<div class="h">Goal: make the worst error (biggest |red| on the right) as small as you can. The dashed lines at ±0.2715 are the lower bound — no line can get under them. At the minimax line the error hits its max 3 times with alternating signs (+, −, +).</div>
</div><script>
const E=Math.E,$=i=>document.getElementById(i),c1=$('c1'),c2=$('c2'),x1=c1.getContext('2d'),x2=c2.getContext('2d');
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function ax(ctx,cv,y0,y1,ticks,title){const W=cv.width,H=cv.height,L=40,T=26,R=10,B=26;
 const X=x=>L+(x+1)/2*(W-L-R),Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);ctx.clearRect(0,0,W,H);ctx.font='12px sans-serif';
 ctx.strokeStyle=css('--grid');ctx.fillStyle=css('--mut');ctx.lineWidth=1;
 for(const t of ticks){ctx.beginPath();ctx.moveTo(L,Y(t));ctx.lineTo(W-R,Y(t));ctx.stroke();ctx.textAlign='right';ctx.fillText(t,L-5,Y(t)+4)}
 ctx.textAlign='center';for(const t of [-1,-.5,0,.5,1])ctx.fillText(t,X(t),H-8);
 ctx.fillStyle=css('--fg');ctx.font='bold 13px sans-serif';ctx.fillText(title,W/2,16);return[X,Y]}
function plot(ctx,X,Y,f,col,w,dash){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();
 for(let i=0;i<=200;i++){const x=-1+i/100;i?ctx.lineTo(X(x),Y(f(x))):ctx.moveTo(X(x),Y(f(x)))}ctx.stroke();ctx.setLineDash([])}
function draw(){const a=+$('a').value,b=+$('b').value;$('av').textContent=a.toFixed(4);$('bv').textContent=b.toFixed(4);
 let [X,Y]=ax(x1,c1,-0.2,3,[0,1,2,3],'eˣ and your line');plot(x1,X,Y,Math.exp,css('--fg'),2.5);plot(x1,X,Y,x=>a+b*x,'#2563eb',2.5);
 [X,Y]=ax(x2,c2,-0.9,0.9,[-0.6,-0.3,0,0.3,0.6],'error  eˣ − (a + bx)');
 x2.fillStyle='rgba(22,163,74,.1)';x2.fillRect(X(-1),Y(0.2715),X(1)-X(-1),Y(-0.2715)-Y(0.2715));
 plot(x2,X,Y,()=>0.2715,'#16a34a',1.2,[5,4]);plot(x2,X,Y,()=>-0.2715,'#16a34a',1.2,[5,4]);
 const e=x=>Math.exp(x)-a-b*x;plot(x2,X,Y,e,'#dc2626',2.5);
 let mx=0,xm=0;for(let i=0;i<=2000;i++){const x=-1+i/1000,v=Math.abs(e(x));if(v>mx){mx=v;xm=x}}
 x2.fillStyle='#dc2626';x2.beginPath();x2.arc(X(xm),Y(e(xm)),6,0,7);x2.fill();
 $('s').innerHTML=`worst error = <span style="color:#dc2626">${mx.toFixed(4)}</span> &nbsp;·&nbsp; minimax best = 0.2788 &nbsp;·&nbsp; lower bound = 0.2715`}
function set(a,b){$('a').value=a;$('b').value=b;draw()}
$('a').oninput=draw;$('b').oninput=draw;
$('t').onclick=()=>set(1,1);$('l').onclick=()=>set(Math.sinh(1),3/E);
$('m').onclick=()=>{const b=(E-1/E)/2,x=Math.log(b);set((E-b*x)/2,b)};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);draw();
</script><script>const __post=()=>parent.postMessage({demoHeight:document.body.scrollHeight+8},'*');addEventListener('load',__post);new ResizeObserver(__post).observe(document.body);</script>
</body></html>

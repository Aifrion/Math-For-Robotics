<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frenet Ride</title>
<style>
:root{--text-primary:#1f2937;--text-secondary:#4b5563;--text-muted:#9ca3af;--text-success:#15803d;--text-accent:#1d4ed8;--bg-accent:#dbeafe;--border:#e5e7eb;--border-strong:#cbd5e1;--border-accent:#93c5fd;--radius:8px;--bg:#fff;--blue:#378ADD;--pink:#D4537E;--green:#16a34a;--amber:#BA7517}
@media (prefers-color-scheme:dark){:root{--text-primary:#e5e7eb;--text-secondary:#cbd5e1;--text-muted:#6b7280;--text-success:#4ade80;--text-accent:#93c5fd;--bg-accent:#1e3a8a;--border:#2f2f2f;--border-strong:#4b5563;--border-accent:#3b82f6;--bg:#191919;--blue:#60a5fa;--pink:#f472b6;--green:#4ade80;--amber:#fbbf24}}
body{margin:0;padding:12px 16px;background:var(--bg);color:var(--text-primary);font:14px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:900px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.btns button{font:inherit;font-size:13px;padding:4px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);cursor:pointer}
.btns button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.row{display:grid;grid-template-columns:200px 1fr 70px;gap:10px;align-items:center;margin:3px 0;font-size:13px}
input[type=range]{width:100%}
#out{font-size:13.5px;margin-top:4px;font-variant-numeric:tabular-nums}
#cap{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.55}
</style></head><body>
<div class="btns"><button data-c="0" class="on">circle</button><button data-c="1">ellipse</button><button data-c="2">clothoid K(s) = s</button><button data-c="3">figure-eight</button>
<span style="flex:1"></span><button id="play">▶ ride</button><button id="stop">⏸</button></div>
<div class="row"><span>position s (arc length)</span><input type="range" id="s" min="0" max="1" step="0.002" value="0.15"><b id="sv"></b></div>
<svg id="sv2" width="100%" viewBox="0 0 860 440"></svg>
<div id="out"></div>
<div id="cap"></div>
<script>
// Ride a curve at unit speed; show T, N, the osculating circle (radius 1/K).
let curve=0,u=0.15,anim=null;
const sv=document.getElementById('sv2');
const css=v=>`var(--${v})`;
// precompute each curve as an arclength-sampled polyline
function build(id){
 const P=[];let fn;
 if(id===0)fn=t=>[1.1*Math.cos(t),1.1*Math.sin(t)],T0=0,T1=2*Math.PI;
 else if(id===1)fn=t=>[1.6*Math.cos(t),0.85*Math.sin(t)],T0=0,T1=2*Math.PI;
 else if(id===2){ // clothoid via integration
  const pts=[];let x=-1.3,y=-0.75,th=0;const ds=0.004;
  for(let s=0;s<3.4;s+=ds){pts.push([x,y]);th=0.5*(s*1.6)*(s*1.6);x+=Math.cos(th)*ds;y+=Math.sin(th)*ds}
  return resample(pts)}
 else fn=t=>[1.5*Math.sin(t),0.9*Math.sin(2*t)],T0=0,T1=2*Math.PI;
 let T0_=0,T1_=2*Math.PI;
 const raw=[];for(let i=0;i<=1500;i++)raw.push(fn(T0_+(T1_-T0_)*i/1500));
 return resample(raw)}
function resample(raw){ // uniform arclength
 const L=[0];for(let i=1;i<raw.length;i++)L.push(L[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]));
 const total=L[raw.length-1],P=[];const M=700;
 let j=0;
 for(let k=0;k<=M;k++){const s=total*k/M;
  while(j<raw.length-2&&L[j+1]<s)j++;
  const f=(s-L[j])/Math.max(L[j+1]-L[j],1e-12);
  P.push([raw[j][0]+f*(raw[j+1][0]-raw[j][0]),raw[j][1]+f*(raw[j+1][1]-raw[j][1])])}
 return{P,total}}
let C=build(0);
const L=60,T=14,W=560,H=400;
const X=v=>L+(v+1.9)/3.8*W*0.68+90, Y=v=>T+H/2-v*(H/2.6);
function frenetAt(i){
 const P=C.P,n=P.length;
 const im=(i-6+n)%n, ip=(i+6)%n;
 const ds=12*C.total/700;
 const Tx=(P[ip][0]-P[im][0])/ds, Ty=(P[ip][1]-P[im][1])/ds;
 const ddx=(P[ip][0]-2*P[i][0]+P[im][0])/Math.pow(6*C.total/700,2);
 const ddy=(P[ip][1]-2*P[i][1]+P[im][1])/Math.pow(6*C.total/700,2);
 const tn=Math.hypot(Tx,Ty);
 const K=Math.abs(Tx*ddy-Ty*ddx)/Math.pow(tn,3);
 // normal toward the bend
 const sgn=Math.sign(Tx*ddy-Ty*ddx)||1;
 return{T:[Tx/tn,Ty/tn],N:[-Ty/tn*sgn,Tx/tn*sgn],K}}
function draw(){
 document.getElementById('sv').textContent=(u*C.total).toFixed(2);
 const closed=curve!==2;
 let d='';C.P.forEach((p,i)=>d+=(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1));
 if(closed)d+='Z';
 let s=`<path d="${d}" stroke="var(--text-muted)" stroke-width="2" fill="none"/>`;
 const i=Math.min(699,Math.max(0,Math.round(u*700)));
 const p=C.P[i],{T:Tv,N:Nv,K}=frenetAt(i);
 // osculating circle
 if(K>0.02&&1/K<6){
  const cx=p[0]+Nv[0]/K, cy=p[1]+Nv[1]/K;
  s+=`<circle cx="${X(cx)}" cy="${Y(cy)}" r="${Math.abs(X(cx+1/K)-X(cx))}" fill="${css('green')}" fill-opacity="0.07" stroke="${css('green')}" stroke-width="1.3" stroke-dasharray="5 4"/>`;
  s+=`<circle cx="${X(cx)}" cy="${Y(cy)}" r="2.5" fill="${css('green')}"/>`}
 const ar=(vx,vy,col,lab)=>{
  const x1=X(p[0]),y1=Y(p[1]),x2=X(p[0]+0.52*vx),y2=Y(p[1]+0.52*vy);
  const dx=x2-x1,dy=y2-y1,dd=Math.hypot(dx,dy),ux=dx/dd,uy=dy/dd,h=8;
  return `<path d="M${x1} ${y1}L${x2} ${y2}M${x2-h*ux+h*0.5*uy} ${y2-h*uy-h*0.5*ux}L${x2} ${y2}L${x2-h*ux-h*0.5*uy} ${y2-h*uy+h*0.5*ux}" stroke="${col}" stroke-width="2.4" fill="none" stroke-linecap="round"/><text x="${x2+10*ux}" y="${y2+10*uy+4}" text-anchor="middle" style="font-size:13px;font-weight:700;fill:${col}">${lab}</text>`};
 s+=ar(Tv[0],Tv[1],css('blue'),'T')+ar(Nv[0],Nv[1],css('pink'),'N');
 s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5.5" fill="var(--text-primary)"/>`;
 sv.innerHTML=s;
 document.getElementById('out').innerHTML=
  `K = <b style="color:${css('green')}">${K.toFixed(3)}</b> · radius of curvature R = 1/K = <b style="color:${css('green')}">${K>1e-3?(1/K).toFixed(2):'∞'}</b>`+
  (curve===2?` · clothoid: K grows linearly with s — steering wheel turned at constant rate`:``);
 const caps=['On a circle, K is the same everywhere (= 1/radius): the osculating circle IS the curve. T turns at constant rate — the simplest nonzero curvature.',
 'On an ellipse K varies: tight at the ends (small osculating circle), gentle on the flanks. Watch R = 1/K breathe as you ride — this is what a robot’s speed controller reads to slow down for corners.',
 'The clothoid: K(s) = s. Roads, railways and robot paths use it because a car at constant speed turns its wheel at constant RATE — curvature changes linearly, never jumps. Jump-free K means jerk-free lateral acceleration.',
 'The figure-eight: K passes through zero at the crossing (inflection — the osculating circle flips sides and momentarily becomes a straight line with R = ∞).'];
 document.getElementById('cap').textContent=caps[curve]}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-c]').forEach(z=>z.classList.toggle('on',z===b));
 curve=+b.dataset.c;C=build(curve);draw()});
document.getElementById('s').oninput=e=>{u=+e.target.value;draw()};
function loop(){u=(u+0.0016)%1;document.getElementById('s').value=u;draw();anim=requestAnimationFrame(loop)}
document.getElementById('play').onclick=()=>{if(!anim)loop()};
document.getElementById('stop').onclick=()=>{if(anim){cancelAnimationFrame(anim);anim=null}};
draw();
const __post=()=>parent.postMessage({demoHeight:document.body.scrollHeight+8},'*');
addEventListener('load',__post);new ResizeObserver(__post).observe(document.body);
</script></body></html>

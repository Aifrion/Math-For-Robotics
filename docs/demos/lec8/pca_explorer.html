<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCA Explorer</title>
<style>
:root{--text-primary:#1f2937;--text-secondary:#4b5563;--text-muted:#9ca3af;--text-accent:#1d4ed8;--bg-accent:#dbeafe;--border:#e5e7eb;--border-strong:#cbd5e1;--border-accent:#93c5fd;--radius:8px;--bg:#fff;--blue:#2563eb;--green:#16a34a;--amber:#BA7517;--red:#dc2626;--pink:#D4537E}
@media (prefers-color-scheme:dark){:root{--text-primary:#e5e7eb;--text-secondary:#cbd5e1;--text-muted:#6b7280;--text-accent:#93c5fd;--bg-accent:#1e3a8a;--border:#2f2f2f;--border-strong:#4b5563;--border-accent:#3b82f6;--bg:#191919;--blue:#60a5fa;--green:#4ade80;--amber:#fbbf24;--red:#f87171;--pink:#f472b6}}
body{margin:0;padding:12px 16px;background:var(--bg);color:var(--text-primary);font:14px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:900px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.row button{font:inherit;font-size:13px;padding:4px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);cursor:pointer}
.row button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
#out{font-size:13.5px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.7}
#cap{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.55}
</style></head><body>
<div class="row">
 <button data-p="0" class="on">elongated cloud</button>
 <button data-p="1">round cloud</button>
 <button data-p="2">two clusters</button>
 <span style="width:12px"></span>
 <button id="tRes" class="on">show residuals</button></div>
<svg id="sv" width="100%" viewBox="0 0 860 440" style="touch-action:none"></svg>
<div id="out"></div>
<div id="cap"></div>
<script>
let pi=0,showRes=true,pts=[],drag=-1;
const sv=document.getElementById('sv');
const css=v=>`var(--${v})`;
const L=20,T=16,W=560,H=408;
const R=3.1;
const X=v=>L+(v+R*W/H*1.02)/(2*R*W/H*1.02)*W, Y=v=>T+(R-v)/(2*R)*H;
const RX=R*W/H*1.02;
const IX=p2=>(p2-L)/W*2*RX-RX, IY=p2=>R-(p2-T)/H*2*R;
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(rnd){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function genPreset(k){const rnd=mulberry(42+k);pts=[];
 if(k===0){const a=0.6;for(let i=0;i<60;i++){const t2=gauss(rnd)*1.7,s=gauss(rnd)*0.4;
  pts.push([t2*Math.cos(a)-s*Math.sin(a),t2*Math.sin(a)+s*Math.cos(a)])}}
 if(k===1){for(let i=0;i<60;i++)pts.push([gauss(rnd)*1.05,gauss(rnd)*0.95])}
 if(k===2){for(let i=0;i<30;i++)pts.push([gauss(rnd)*0.45-1.5,gauss(rnd)*0.45+0.9]);
  for(let i=0;i<30;i++)pts.push([gauss(rnd)*0.45+1.5,gauss(rnd)*0.45-0.9])}}
function pca(){const n=pts.length;
 const mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;
 let sxx=0,sxy=0,syy=0;
 for(const p of pts){const dx=p[0]-mx,dy=p[1]-my;sxx+=dx*dx;sxy+=dx*dy;syy+=dy*dy}
 sxx/=n;sxy/=n;syy/=n;
 const tr=sxx+syy,det=sxx*syy-sxy*sxy;
 const l1=tr/2+Math.sqrt(Math.max(0,tr*tr/4-det)),l2=tr-l1;
 let v=[sxy,l1-sxx];if(Math.hypot(v[0],v[1])<1e-9)v=[1,0];
 const nv=Math.hypot(v[0],v[1]);v=[v[0]/nv,v[1]/nv];
 return{mx,my,l1,l2,v}}
function draw(){
 const{mx,my,l1,l2,v}=pca();
 const u2=[-v[1],v[0]];
 let s=`<rect x="${L}" y="${T}" width="${W}" height="${H}" fill="none" stroke="var(--border)" stroke-width="0.6"/>`;
 // residuals to PC1 line
 let mse=0;
 pts.forEach(p=>{const dx=p[0]-mx,dy=p[1]-my;const q=dx*v[0]+dy*v[1];
  const rx2=mx+q*v[0],ry=my+q*v[1];
  const r2=(p[0]-rx2)**2+(p[1]-ry)**2;mse+=r2;
  if(showRes)s+=`<path d="M${X(p[0])} ${Y(p[1])}L${X(rx2)} ${Y(ry)}" stroke="${css('red')}" stroke-width="1" opacity="0.5"/>`;
  if(showRes)s+=`<circle cx="${X(rx2)}" cy="${Y(ry)}" r="2" fill="${css('red')}" opacity="0.6"/>`});
 mse/=pts.length;
 // pc axes scaled by sqrt(lambda)
 const a1=2*Math.sqrt(Math.max(0,l1)),a2=2*Math.sqrt(Math.max(0,l2));
 s+=`<path d="M${X(mx-a1*v[0])} ${Y(my-a1*v[1])}L${X(mx+a1*v[0])} ${Y(my+a1*v[1])}" stroke="${css('blue')}" stroke-width="3.5"/>`;
 s+=`<path d="M${X(mx-a2*u2[0])} ${Y(my-a2*u2[1])}L${X(mx+a2*u2[0])} ${Y(my+a2*u2[1])}" stroke="${css('pink')}" stroke-width="2.5"/>`;
 pts.forEach((p,i)=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5.5" fill="${css('green')}" style="cursor:grab"/>`});
 s+=`<circle cx="${X(mx)}" cy="${Y(my)}" r="4" fill="var(--text-primary)"/>`;
 // readout panel
 const P=610;
 const pct=100*l1/(l1+l2);
 s+=`<text x="${P}" y="50" style="font-size:14px;font-weight:600;fill:${css('blue')}">u₁: λ₁ = ${l1.toFixed(3)}</text>`;
 s+=`<text x="${P}" y="74" style="font-size:14px;font-weight:600;fill:${css('pink')}">u₂: λ₂ = ${l2.toFixed(3)}</text>`;
 s+=`<text x="${P}" y="104" style="font-size:13px;fill:var(--text-primary)">PC1 keeps ${pct.toFixed(1)}% of variance</text>`;
 s+=`<text x="${P}" y="134" style="font-size:13px;fill:var(--text-primary)">reconstruction MSE with 1 PC:</text>`;
 s+=`<text x="${P}" y="154" style="font-size:13px;fill:${css('red')}">measured ${mse.toFixed(4)}</text>`;
 s+=`<text x="${P}" y="174" style="font-size:13px;fill:${css('pink')}">dropped λ₂ = ${l2.toFixed(4)} ${Math.abs(mse-l2)<2e-3?'✓ equal':''}</text>`;
 s+=`<text x="${P}" y="212" style="font-size:12px;fill:var(--text-muted)">axes drawn 2√λ long from the mean</text>`;
 s+=`<text x="${P}" y="230" style="font-size:12px;fill:var(--text-muted)">drag any point; everything updates</text>`;
 sv.innerHTML=s;
 const caps=[
  'A stretched cloud: PCA finds the long axis (blue u₁) and ranks directions by variance λ. The red whiskers are what you throw away if you keep only PC1 — and their mean square is exactly λ₂. Drag a point far away and watch it yank the axis.',
  'A nearly round cloud: λ₁ ≈ λ₂, so no direction is special, PC1 keeps only ~50% of the variance, and the axes swing wildly if you drag one point. PCA compresses only what is actually elongated.',
  'Two clusters: PCA happily spans the gap between them — great for compression, but the single best-variance axis says nothing about class labels. That failure is exactly why LDA exists (next demo).'];
 document.getElementById('cap').textContent=caps[pi];
 document.getElementById('out').innerHTML=`q = u₁ᵀ(x − μ): each green point gets one number; Uq + μ rebuilds the red approximation (${pts.length} points)`}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pi=+b.dataset.p;
 document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b));genPreset(pi);draw()});
document.getElementById('tRes').onclick=()=>{showRes=!showRes;tRes.classList.toggle('on',showRes);draw()};
function evt(e){const r=sv.getBoundingClientRect();return[(e.clientX-r.left)*860/r.width,(e.clientY-r.top)*440/r.height]}
sv.addEventListener('pointerdown',e=>{const[a,b]=evt(e);
 drag=pts.findIndex(p=>Math.hypot(X(p[0])-a,Y(p[1])-b)<14);
 if(drag>=0)sv.setPointerCapture(e.pointerId)});
sv.addEventListener('pointermove',e=>{if(drag<0)return;const[a,b]=evt(e);
 pts[drag]=[Math.max(-RX,Math.min(RX,IX(a))),Math.max(-R,Math.min(R,IY(b)))];draw()});
sv.addEventListener('pointerup',()=>drag=-1);
genPreset(0);draw();
const post=()=>parent.postMessage({demoHeight:document.body.scrollHeight+8},'*');
addEventListener('load',post);new ResizeObserver(post).observe(document.body);
</script></body></html>

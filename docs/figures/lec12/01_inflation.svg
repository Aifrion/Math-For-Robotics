ill="#111827" font-weight="bold">a 2.4 × 0.6 robot vs a 1.0 gap</text><path d="M610 285H830" stroke="#e5e7eb"/><path d="M610 193H830" stroke="#e5e7eb"/><path d="M610 100H830" stroke="#e5e7eb"/><path d="M610 45V285H830" stroke="#111827" fill="none"/><path d="M610 285v4" stroke="#111827"/><text x="610" y="302" font-size="11" text-anchor="middle" fill="#111827">0</text><path d="M720 285v4" stroke="#111827"/><text x="720" y="302" font-size="11" text-anchor="middle" fill="#111827">45</text><path d="M830 285v4" stroke="#111827"/><text x="830" y="302" font-size="11" text-anchor="middle" fill="#111827">90</text><path d="M610 285h-4" stroke="#111827"/><text x="603" y="289" font-size="11" text-anchor="end" fill="#111827">0</text><path d="M610 193h-4" stroke="#111827"/><text x="603" y="197" font-size="11" text-anchor="end" fill="#111827">1</text><path d="M610 100h-4" stroke="#111827"/><text x="603" y="104" font-size="11" text-anchor="end" fill="#111827">2</text><text x="720" y="319" font-size="12" text-anchor="middle" fill="#111827">θ (deg)</text><clipPath id="c37"><rect x="610" y="45" width="220" height="240"/></clipPath><path d="M610 63L632 57 655 57 657 58 666 59 685 66 691 69 710 81 733 100 746 115 758 127 760 131 766 137 780 156 783 159 785 163 811 199 813 204 819 212 830 230" stroke="#2563eb" stroke-width="2.2" fill="none" clip-path="url(#c37)"/><path d="M610 193H830" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/><text x="620" y="182" font-size="10.5" text-anchor="start" fill="#dc2626">gap</text><path d="M808 45L811 45L813 45L816 45L819 45L822 45L824 45L827 45L830 45L830 285L827 285L824 285L822 285L819 285L816 285L813 285L811 285L808 285Z" fill="#16a34a" fill-opacity="0.15" clip-path="url(#c37)"/><text x="752" y="255" font-size="10.5" text-anchor="start" fill="#16a34a">fits only for</text><text x="752" y="274" font-size="10.5" text-anchor="start" fill="#16a34a" font-weight="bold">θ &gt; 80.2°</text><text x="430" y="340" font-size="11.5" text-anchor="middle" fill="#6b7280">Point-robot trick: inflate the obstacle (rounded corners!). But inflation depends on θ — (x, y) alone is not the configuration.</text></svg>
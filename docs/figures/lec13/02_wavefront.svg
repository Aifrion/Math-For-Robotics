troke="#BA7517" stroke-width="2.5"/><path d="M130 264L130 231L130 197L170 197L210 197L250 197L290 197L330 197L370 197L370 163L370 129L370 96L410 96L450 96L490 96" stroke="#dc2626" stroke-width="2" opacity="0.65" fill="none"/><text x="596" y="90" font-size="12.5" text-anchor="start" fill="#111827" font-weight="bold">cost-to-go as a navigation</text><text x="596" y="108" font-size="12.5" text-anchor="start" fill="#111827" font-weight="bold">FUNCTION (a policy):</text><text x="596" y="136" font-size="11.5" text-anchor="start" fill="#6b7280">from ANY cell, step to any</text><text x="596" y="153" font-size="11.5" text-anchor="start" fill="#6b7280">neighbor with smaller φ.</text><text x="596" y="181" font-size="11.5" text-anchor="start" fill="#16a34a">verified: no local minima —</text><text x="596" y="198" font-size="11.5" text-anchor="start" fill="#16a34a">greedy descent cannot stall</text><text x="596" y="226" font-size="11.5" text-anchor="start" fill="#dc2626">(a hand-built potential field</text><text x="596" y="243" font-size="11.5" text-anchor="start" fill="#dc2626">on the same idea got stuck</text><text x="596" y="260" font-size="11.5" text-anchor="start" fill="#dc2626">in a U-trap after 23 steps)</text><text x="430" y="342" font-size="11" text-anchor="middle" fill="#6b7280">BFS from the goal turns the grid into a controller: the red path is pure greedy descent of φ.</text></svg>
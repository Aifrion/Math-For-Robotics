<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><path d="M101 172L129 75L164 158Z" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="101" y="172" font-size="1" text-anchor="start" fill="#111827"></text><text x="93" y="186" font-size="10.5" text-anchor="middle" fill="#6b7280">best</text><text x="166" y="174" font-size="10.5" text-anchor="middle" fill="#6b7280">worst</text><circle cx="115" cy="124" r="3" fill="#6b7280"/><path d="M164 158L66 90" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="66" cy="90" r="5" fill="#2563eb"/><path d="M101 172L66 90L129 75" fill="none" stroke="#2563eb" stroke-width="1.6"/><text x="115" y="40" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">reflection</text><text x="115" y="236" font-size="11" text-anchor="middle" fill="#6b7280">flip the worst point</text><text x="115" y="251" font-size="11" text-anchor="middle" fill="#6b7280">through the centroid</text><path d="M311 172L339 75L374 158Z" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="311" y="172" font-size="1" text-anchor="start" fill="#111827"></text><text x="303" y="186" font-size="10.5" text-anchor="middle" fill="#6b7280">best</text><text x="376" y="174" font-size="10.5" text-anchor="middle" fill="#6b7280">worst</text><circle cx="325" cy="124" r="3" fill="#6b7280"/><path d="M374 158L226 56" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="226" cy="56" r="5" fill="#16a34a"/><path d="M311 172L226 56L339 75" fill="none" stroke="#16a34a" stroke-width="1.6"/><text x="325" y="40" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">expansion</text><text x="325" y="236" font-size="11" text-anchor="middle" fill="#6b7280">reflection was great:</text><text x="325" y="251" font-size="11" text-anchor="middle" fill="#6b7280">go twice as far</text><path d="M521 172L549 75L584 158Z" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="521" y="172" font-size="1" text-anchor="start" fill="#111827"></text><text x="513" y="186" font-size="10.5" text-anchor="middle" fill="#6b7280">best</text><text x="586" y="174" font-size="10.5" text-anchor="middle" fill="#6b7280">worst</text><circle cx="535" cy="124" r="3" fill="#6b7280"/><path d="M584 158L560 141" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="560" cy="141" r="5" fill="#ea580c"/><path d="M521 172L560 141L549 75" fill="none" stroke="#ea580c" stroke-width="1.6"/><text x="535" y="40" font-size="13" text-anchor="middle" fill="#ea580c" font-weight="bold">contraction</text><text x="535" y="236" font-size="11" text-anchor="middle" fill="#6b7280">reflection was bad:</text><text x="535" y="251" font-size="11" text-anchor="middle" fill="#6b7280">pull inward instead</text><path d="M731 172L759 75L794 158Z" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="731" y="172" font-size="1" text-anchor="start" fill="#111827"></text><text x="723" y="186" font-size="10.5" text-anchor="middle" fill="#6b7280">best</text><text x="796" y="174" font-size="10.5" text-anchor="middle" fill="#6b7280">worst</text><path d="M759 75L745 124" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="745" cy="124" r="4.5" fill="#dc2626"/><path d="M794 158L763 165" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="763" cy="165" r="4.5" fill="#dc2626"/><path d="M731 172L745 124L763 165Z" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.6"/><text x="745" y="40" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">shrink</text><text x="745" y="236" font-size="11" text-anchor="middle" fill="#6b7280">nothing works: shrink</text><text x="745" y="251" font-size="11" text-anchor="middle" fill="#6b7280">everything toward the best</text><text x="430" y="284" font-size="11.5" text-anchor="middle" fill="#6b7280">One Nelder–Mead step = try these in order. The triangle oozes downhill, stretching along valleys and shrinking at the bottom.</text></svg>
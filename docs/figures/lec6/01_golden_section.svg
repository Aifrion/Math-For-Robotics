<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="380" y="30" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Golden section: place the probe so both outcomes shrink the bracket the same way</text><path d="M60 90H700" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/><path d="M60 83V97" stroke="#111827" stroke-width="2"/><text x="60" y="76" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">a</text><path d="M304 83V97" stroke="#2563eb" stroke-width="2"/><text x="304" y="76" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">b</text><path d="M456 83V97" stroke="#ea580c" stroke-width="2"/><text x="456" y="76" font-size="13" text-anchor="middle" fill="#ea580c" font-weight="bold">x</text><path d="M700 83V97" stroke="#111827" stroke-width="2"/><text x="700" y="76" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">c</text><path d="M60 108H304.45824720006726" stroke="#2563eb" stroke-width="2"/><text x="182" y="124" font-size="12" text-anchor="middle" fill="#2563eb">w = 0.382</text><path d="M304.45824720006726 108H700" stroke="#6b7280" stroke-width="2"/><text x="502" y="124" font-size="12" text-anchor="middle" fill="#6b7280">1 − w = 0.618</text><text x="180" y="162" font-size="12.5" text-anchor="middle" fill="#16a34a" font-weight="bold">if f(x) &gt; f(b): keep [a, x]</text><path d="M60 190H456" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M60 183V197" stroke="#111827" stroke-width="2"/><text x="60" y="176" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">a</text><path d="M304 183V197" stroke="#2563eb" stroke-width="2"/><text x="304" y="176" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">b</text><path d="M456 183V197" stroke="#ea580c" stroke-width="2"/><text x="456" y="176" font-size="13" text-anchor="middle" fill="#ea580c" font-weight="bold">x</text><text x="258" y="220" font-size="11.5" text-anchor="middle" fill="#6b7280">new bracket = 0.618 of the old</text><text x="180" y="250" font-size="12.5" text-anchor="middle" fill="#16a34a" font-weight="bold">if f(x) &lt; f(b): keep [b, c]</text><path d="M304 278H700" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M304 271V285" stroke="#2563eb" stroke-width="2"/><text x="304" y="264" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">b</text><path d="M456 271V285" stroke="#ea580c" stroke-width="2"/><text x="456" y="264" font-size="13" text-anchor="middle" fill="#ea580c" font-weight="bold">x</text><path d="M700 271V285" stroke="#111827" stroke-width="2"/><text x="700" y="264" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">c</text><text x="502" y="308" font-size="11.5" text-anchor="middle" fill="#6b7280">also 0.618 of the old — same ratios inside, so it repeats forever</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="380" y="28" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">Dynamic programming: label every node with its cost-to-go, then just walk downhill</text><path d="M80 165L280 85" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="180" y="118" font-size="12" text-anchor="middle" fill="#dc2626">1</text><path d="M80 165L280 245" stroke="#16a34a" stroke-width="3.5"/><text x="180" y="198" font-size="12" text-anchor="middle" fill="#16a34a">4</text><path d="M280 85L500 55" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="390" y="63" font-size="12" text-anchor="middle" fill="#dc2626">4</text><path d="M280 85L500 165" stroke="#6b7280" stroke-width="1.3"/><text x="390" y="118" font-size="12" text-anchor="middle" fill="#111827">5</text><path d="M280 245L500 165" stroke="#16a34a" stroke-width="3.5"/><text x="390" y="198" font-size="12" text-anchor="middle" fill="#16a34a">1</text><path d="M280 245L500 275" stroke="#6b7280" stroke-width="1.3"/><text x="390" y="253" font-size="12" text-anchor="middle" fill="#111827">2</text><path d="M500 55L690 165" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="595" y="103" font-size="12" text-anchor="middle" fill="#dc2626">5</text><path d="M500 165L690 165" stroke="#16a34a" stroke-width="3.5"/><text x="595" y="158" font-size="12" text-anchor="middle" fill="#16a34a">1</text><path d="M500 275L690 165" stroke="#6b7280" stroke-width="1.3"/><text x="595" y="213" font-size="12" text-anchor="middle" fill="#111827">4</text><circle cx="80" cy="165" r="22" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="80" y="163" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">S</text><text x="80" y="178" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">6</text><circle cx="280" cy="85" r="22" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="280" y="83" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A1</text><text x="280" y="98" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">6</text><circle cx="280" cy="245" r="22" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="280" y="243" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">A2</text><text x="280" y="258" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">2</text><circle cx="500" cy="55" r="22" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="500" y="53" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B1</text><text x="500" y="68" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">5</text><circle cx="500" cy="165" r="22" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="500" y="163" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B2</text><text x="500" y="178" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">1</text><circle cx="500" cy="275" r="22" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="500" y="273" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">B3</text><text x="500" y="288" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">4</text><circle cx="690" cy="165" r="22" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="690" y="163" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold">G</text><text x="690" y="178" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="bold">0</text><text x="380" y="322" font-size="11.5" text-anchor="middle" fill="#6b7280">Blue number = cheapest cost from that node to G, filled right-to-left: cost-to-go(n) = min over edges (edge + cost-to-go(next)).</text><text x="380" y="340" font-size="11.5" text-anchor="middle" fill="#6b7280">Green = optimal path (6). Red dashed = greedy 'always take the cheapest next edge' (10). Greedy can't see past one stage; DP sees to the end.</text></svg>
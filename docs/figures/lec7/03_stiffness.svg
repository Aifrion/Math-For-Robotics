rt" fill="#6b7280">2e⁻ˣ (slow part)</text><text x="645" y="37" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">Next 5 s: only the slow part remains</text><path d="M475 265H815" stroke="#e5e7eb"/><path d="M475 160H815" stroke="#e5e7eb"/><path d="M475 55H815" stroke="#e5e7eb"/><path d="M475 45V265H815" stroke="#111827" fill="none"/><path d="M475 265v4" stroke="#111827"/><text x="475" y="282" font-size="11" text-anchor="middle" fill="#111827">0</text><path d="M543 265v4" stroke="#111827"/><text x="543" y="282" font-size="11" text-anchor="middle" fill="#111827">1</text><path d="M611 265v4" stroke="#111827"/><text x="611" y="282" font-size="11" text-anchor="middle" fill="#111827">2</text><path d="M679 265v4" stroke="#111827"/><text x="679" y="282" font-size="11" text-anchor="middle" fill="#111827">3</text><path d="M747 265v4" stroke="#111827"/><text x="747" y="282" font-size="11" text-anchor="middle" fill="#111827">4</text><path d="M815 265v4" stroke="#111827"/><text x="815" y="282" font-size="11" text-anchor="middle" fill="#111827">5</text><path d="M475 265h-4" stroke="#111827"/><text x="468" y="269" font-size="11" text-anchor="end" fill="#111827">0</text><path d="M475 160h-4" stroke="#111827"/><text x="468" y="164" font-size="11" text-anchor="end" fill="#111827">1</text><path d="M475 55h-4" stroke="#111827"/><text x="468" y="59" font-size="11" text-anchor="end" fill="#111827">2</text><text x="645" y="299" font-size="12" text-anchor="middle" fill="#111827">x</text><clipPath id="c47"><rect x="475" y="45" width="340" height="220"/></clipPath><path d="M475 160L476 59 478 66 480 69 486 88 488 91 495 110 498 115 503 127 505 129 511 142 513 144 520 158 522 159 528 170 530 171 535 179 538 181 541 186 549 194 550 196 569 213 572 214 576 218 582 221 585 224 590 226 594 229 596 229 598 231 602 233 606 234 611 237 613 237 618 240 621 240 624 242 630 243 636 246 640 246 644 248 647 248 648 249 651 249 652 250 656 250 657 251 660 251 661 252 666 252 667 253 672 253 673 254 679 254 680 255 684 255 685 256 692 256 693 257 701 257 702 258 710 258 712 259 722 259 723 260 735 260 737 261 752 261 754 262 775 262 776 263 810 263 812 264 815 264" stroke="#2563eb" stroke-width="2.4" fill="none" clip-path="url(#c47)"/><text x="430" y="310" font-size="11.5" text-anchor="middle" fill="#6b7280">The slides' stiff system (eigenvalues −1 and −1000). The e⁻¹⁰⁰⁰ˣ term is invisible after x ≈ 0.01, yet explicit Euler must keep</text><text x="430" y="328" font-size="11.5" text-anchor="middle" fill="#6b7280">h &lt; 2/1000 = 0.002 forever: at h = 0.0021 the solution explodes to −7×10⁹ (verified). The dead component still owns your step size.</text></svg>
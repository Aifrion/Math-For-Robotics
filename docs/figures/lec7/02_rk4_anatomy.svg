h="url(#c18)"/><circle cx="346" cy="212" r="4" fill="#ea580c" stroke="#ea580c" stroke-width="1.6"/><text x="354" y="230" font-size="12" text-anchor="start" fill="#ea580c" font-weight="bold">k₂: slope at midpoint, using k₁</text><path d="M254 215L437 157" stroke="#7c3aed" stroke-width="2.6" fill="none" clip-path="url(#c18)"/><circle cx="346" cy="186" r="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="354" y="164" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="bold">k₃: midpoint again, using k₂</text><path d="M540 128L723 36" stroke="#dc2626" stroke-width="2.6" fill="none" clip-path="url(#c18)"/><circle cx="631" cy="82" r="4" fill="#dc2626" stroke="#dc2626" stroke-width="1.6"/><text x="619" y="76" font-size="12" text-anchor="end" fill="#dc2626" font-weight="bold">k₄: slope at the end, using k₃</text><circle cx="631" cy="86" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="619" y="116" font-size="12" text-anchor="end" fill="#16a34a" font-weight="bold">y₊ = y + (k₁+2k₂+2k₃+k₄)/6 = 2.7083  (true e = 2.7183)</text><text x="380" y="334" font-size="11.5" text-anchor="middle" fill="#6b7280">Four cheap slope probes per step, weighted 1:2:2:1, cancel error terms up to h⁴ — per-step error O(h⁵). Even with h = 1, RK4 lands within 0.2%.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="380" y="37" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">log₁₀ |error| marching from x = 1 toward the singularity (h = 0.05)</text><path d="M70 69H690" stroke="#e5e7eb"/><path d="M70 118H690" stroke="#e5e7eb"/><path d="M70 167H690" stroke="#e5e7eb"/><path d="M70 216H690" stroke="#e5e7eb"/><path d="M70 265H690" stroke="#e5e7eb"/><path d="M70 45V265H690" stroke="#111827" fill="none"/><path d="M101 265v4" stroke="#111827"/><text x="101" y="282" font-size="11" text-anchor="middle" fill="#111827">0.05</text><path d="M225 265v4" stroke="#111827"/><text x="225" y="282" font-size="11" text-anchor="middle" fill="#111827">0.25</text><path d="M380 265v4" stroke="#111827"/><text x="380" y="282" font-size="11" text-anchor="middle" fill="#111827">0.5</text><path d="M535 265v4" stroke="#111827"/><text x="535" y="282" font-size="11" text-anchor="middle" fill="#111827">0.75</text><path d="M690 265v4" stroke="#111827"/><text x="690" y="282" font-size="11" text-anchor="middle" fill="#111827">1</text><path d="M70 69h-4" stroke="#111827"/><text x="63" y="73" font-size="11" text-anchor="end" fill="#111827">1e0</text><path d="M70 118h-4" stroke="#111827"/><text x="63" y="122" font-size="11" text-anchor="end" fill="#111827">1e-2</text><path d="M70 167h-4" stroke="#111827"/><text x="63" y="171" font-size="11" text-anchor="end" fill="#111827">1e-4</text><path d="M70 216h-4" stroke="#111827"/><text x="63" y="220" font-size="11" text-anchor="end" fill="#111827">1e-6</text><path d="M70 265h-4" stroke="#111827"/><text x="63" y="269" font-size="11" text-anchor="end" fill="#111827">1e-8</text><text x="380" y="299" font-size="12" text-anchor="middle" fill="#111827">x</text><clipPath id="c28"><rect x="70" y="45" width="620" height="220"/></clipPath><path d="M659 141L628 133 566 124 504 118 287 101 225 95 194 91 132 80 101 69" stroke="#ea580c" stroke-width="2.2" fill="none" clip-path="url(#c28)"/><path d="M659 267L628 258 597 252 535 242 442 229 349 214 318 208 256 194 225 185 194 174 163 160 132 141 101 111" stroke="#16a34a" stroke-width="2.2" fill="none" clip-path="url(#c28)"/><path d="M659 192L628 184 597 179 535 171 318 151 256 143 225 138 163 125 132 114 101 95" stroke="#7c3aed" stroke-width="2.2" fill="none" stroke-dasharray="5 4" clip-path="url(#c28)"/><path d="M290 57h20" stroke="#ea580c" stroke-width="2.5"/><text x="316" y="61" font-size="11" text-anchor="start" fill="#111827">Euler</text><path d="M290 74h20" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4"/><text x="316" y="78" font-size="11" text-anchor="start" fill="#111827">Richardson on Euler</text><path d="M290 91h20" stroke="#16a34a" stroke-width="2.5"/><text x="316" y="95" font-size="11" text-anchor="start" fill="#111827">RK4</text><text x="380" y="100" font-size="10.5" text-anchor="start" fill="#ea580c">2.6e−2</text><text x="380" y="149" font-size="10.5" text-anchor="start" fill="#7c3aed">2.7e−4</text><text x="380" y="233" font-size="10.5" text-anchor="start" fill="#16a34a">7.5e−7</text><text x="380" y="310" font-size="11.5" text-anchor="middle" fill="#6b7280">Each extra order of accuracy buys ~2-3 digits at the same cost — until the singularity at x = 0 eats everyone's accuracy.</text></svg>
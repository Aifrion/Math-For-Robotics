<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="320" y="37" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">the Frenet frame riding a helix (a = 2, b = 1)</text><path d="M60 45V355H580" stroke="#111827" fill="none"/><clipPath id="c2"><rect x="60" y="45" width="520" height="310"/></clipPath><path d="M443 303L449 297 453 290 453 287 454 286 454 281 453 280 452 274 450 272 448 268 437 259 426 252 424 252 411 245 409 245 398 240 395 240 386 236 383 236 376 233 373 233 365 230 363 230 346 225 343 225 338 223 326 221 312 217 303 216 297 214 289 213 283 211 241 204 239 203 236 203 234 202 231 202 229 201 226 201 214 198 210 198 199 195 195 195 194 194 186 192 183 192 179 190 173 189 165 185 163 185 163 184 162 184 160 182 160 181 159 181 159 178 164 173 177 167 179 167 180 166 182 166 183 165 185 165 192 162 198 161 202 159 208 158 212 156 215 156 219 154 222 154 226 152 229 152 249 146 252 146 274 139 277 139 289 135 292 135 303 131 306 131 326 124 329 124 363 112 366 112 396 100 413 92" stroke="#6b7280" stroke-width="2" fill="none" clip-path="url(#c2)"/><path d="M434.7 257.7L399.0 234.5M403.5 242.2L399.0 234.5L407.9 235.5" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M434.7 257.7L364.1 264.6M372.4 267.8L364.1 264.6L371.6 259.9" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M434.7 257.7L452.5 223.9M445.2 229.1L452.5 223.9L452.3 232.8" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="434.7" cy="257.7" r="3.5" fill="#111827"/><path d="M170.1 187.6L142.4 177.5M148.5 184.0L142.4 177.5L151.3 176.5" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.1 187.6L245.0 187.7M237.0 183.7L245.0 187.7L237.0 191.7" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.1 187.6L183.9 147.3M177.5 153.6L183.9 147.3L185.1 156.2" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170.1" cy="187.6" r="3.5" fill="#111827"/><path d="M346.1 118.2L416.0 95.2M407.1 93.9L416.0 95.2L409.6 101.5" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M346.1 118.2L324.2 111.1M330.6 117.3L324.2 111.1L333.1 109.7" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M346.1 118.2L311.2 84.3M314.2 92.7L311.2 84.3L319.8 87.0" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="346.1" cy="118.2" r="3.5" fill="#111827"/><text x="394" y="231" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">T</text><text x="342" y="267" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">N</text><text x="457" y="216" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">B</text><text x="616" y="90" font-size="12.5" text-anchor="start" fill="#111827" font-weight="bold">verified for this helix:</text><text x="616" y="118" font-size="12" text-anchor="start" fill="#6b7280">speed √(a²+b²) = 2.236</text><text x="616" y="142" font-size="12" text-anchor="start" fill="#dc2626">K = a/(a²+b²) = 0.400</text><text x="616" y="166" font-size="12" text-anchor="start" fill="#16a34a">τ = b/(a²+b²) = 0.200</text><text x="616" y="198" font-size="12" text-anchor="start" fill="#111827">T′ = K N</text><text x="616" y="222" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">N′ = −K T + τ B</text><text x="616" y="246" font-size="12" text-anchor="start" fill="#111827">B′ = −τ N</text><text x="616" y="274" font-size="11" text-anchor="start" fill="#dc2626">(the slide's N′ = +K T + τ B</text><text x="616" y="291" font-size="11" text-anchor="start" fill="#dc2626">misses by exactly 2K)</text><text x="430" y="382" font-size="11.5" text-anchor="middle" fill="#6b7280">T points along the motion, N toward the bend's center, B completes the frame. Constant K and τ — the helix is the “circle” of space curves.</text></svg>
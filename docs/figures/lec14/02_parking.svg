<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="320" y="37" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">parallel parking: flow +V₁, +V₂, −V₁, −V₂ … and creep sideways</text><path d="M60 45V355H580" stroke="#111827" fill="none"/><clipPath id="c2"><rect x="60" y="45" width="520" height="310"/></clipPath><path d="M249 272L249 234 248 231 248 212 247 209 247 196 246 193 245 171 244 168 244 162 243 159 243 152 242 146" stroke="#2563eb" stroke-width="2" fill="none" clip-path="url(#c2)"/><path d="M242 146L241 134 240 131 240 121 238 109 237 84 236 81 236 62 235 59 235 21" stroke="#16a34a" stroke-width="2" fill="none" clip-path="url(#c2)"/><path d="M235 21L235 46 234 49 234 74 233 77 233 93 232 96 232 106 231 109 231 118 230 121 230 128 229 131 229 140 228 146" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="4 3" clip-path="url(#c2)"/><path d="M228 146L227 149 227 156 226 159 225 177 224 181 224 190 223 193 222 224 221 228 221 265 220 268 220 272" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="4 3" clip-path="url(#c2)"/><path d="M220 272L220 224 219 221 218 190 217 187 217 177 215 165 214 146" stroke="#2563eb" stroke-width="2" fill="none" clip-path="url(#c2)"/><path d="M214 146L211 128 211 118 210 115 209 93 208 90 208 74 207 71 207 49 206 46 206 21" stroke="#16a34a" stroke-width="2" fill="none" clip-path="url(#c2)"/><path d="M206 21L206 59 205 62 205 81 204 84 204 96 203 99 203 112 201 124 201 134 199 146" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="4 3" clip-path="url(#c2)"/><path d="M199 146L198 153 198 162 196 174 195 196 194 199 194 212 193 215 193 234 192 237 192 272" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="4 3" clip-path="url(#c2)"/><path d="M192 272L192 243 191 240 191 215 190 212 190 199 189 196 188 174 187 171 187 162 186 159 186 152 185 146" stroke="#2563eb" stroke-width="2" fill="none" clip-path="url(#c2)"/><path d="M185 146L184 134 183 131 183 124 182 121 182 115 181 112 180 87 179 84 179 65 178 62 178 21" stroke="#16a34a" stroke-width="2" fill="none" clip-path="url(#c2)"/><path d="M178 21L178 34 177 37 177 68 176 71 176 90 175 93 175 103 174 106 174 115 173 118 173 128 172 131 171 146" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="4 3" clip-path="url(#c2)"/><path d="M171 146L170 149 170 156 169 159 169 165 167 177 166 203 165 206 165 218 164 221 164 250 163 253 163 272" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="4 3" clip-path="url(#c2)"/><circle cx="249.1" cy="271.5" r="5" fill="#111827"/><circle cx="163.3" cy="271.5" r="5" fill="#BA7517"/><path d="M249.1 271.5L119.1 271.5M127.1 275.5L119.1 271.5L127.1 267.5" stroke="#dc2626" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="292" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="bold">net creep per cycle ≈ ε²·[V₁,V₂]</text><text x="249" y="260" font-size="11" text-anchor="middle" fill="#111827">start</text><text x="163" y="260" font-size="11" text-anchor="middle" fill="#BA7517">after 3 cycles</text><text x="616" y="90" font-size="12.5" text-anchor="start" fill="#111827" font-weight="bold">car controls (v, φ):</text><text x="616" y="116" font-size="11.5" text-anchor="start" fill="#6b7280">ẋ = v cos φ cos θ</text><text x="616" y="136" font-size="11.5" text-anchor="start" fill="#6b7280">ẏ = v cos φ sin θ</text><text x="616" y="156" font-size="11.5" text-anchor="start" fill="#6b7280">θ̇ = (v/l) sin φ</text><text x="616" y="188" font-size="11.5" text-anchor="start" fill="#111827">no control moves the car</text><text x="616" y="205" font-size="11.5" text-anchor="start" fill="#111827">sideways — but the bracket</text><text x="616" y="230" font-size="11.5" text-anchor="start" fill="#dc2626" font-weight="bold">[V₁,V₂] = sin(φ₁−φ₂)/l ·</text><text x="616" y="248" font-size="11.5" text-anchor="start" fill="#dc2626" font-weight="bold">(−sin θ, cos θ, 0)</text><text x="616" y="274" font-size="11.5" text-anchor="start" fill="#111827">does. verified: wiggle net =</text><text x="616" y="291" font-size="11.5" text-anchor="start" fill="#111827">0.999 × ε²|[V₁,V₂]|, pure</text><text x="616" y="308" font-size="11.5" text-anchor="start" fill="#111827">sideways, zero net rotation</text><text x="430" y="382" font-size="11" text-anchor="middle" fill="#6b7280">Solid = forward flows, dashed = reverse. Each 4-phase cycle returns θ to start but shifts the car perpendicular to its heading — the Lie bracket is the escape from nonholonomy.</text></svg>
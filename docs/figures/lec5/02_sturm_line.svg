<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="410" y="62" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">Sturm's theorem on x⁵ + 5x⁴ − 20x² − 10x + 2: sign changes count roots</text><path d="M40 70V160H780" stroke="#111827" fill="none"/><path d="M74 160v4" stroke="#111827"/><text x="74" y="177" font-size="11" text-anchor="middle" fill="#111827">−5</text><path d="M141 160v4" stroke="#111827"/><text x="141" y="177" font-size="11" text-anchor="middle" fill="#111827">−4</text><path d="M208 160v4" stroke="#111827"/><text x="208" y="177" font-size="11" text-anchor="middle" fill="#111827">−3</text><path d="M275 160v4" stroke="#111827"/><text x="275" y="177" font-size="11" text-anchor="middle" fill="#111827">−2</text><path d="M343 160v4" stroke="#111827"/><text x="343" y="177" font-size="11" text-anchor="middle" fill="#111827">−1</text><path d="M410 160v4" stroke="#111827"/><text x="410" y="177" font-size="11" text-anchor="middle" fill="#111827">0</text><path d="M477 160v4" stroke="#111827"/><text x="477" y="177" font-size="11" text-anchor="middle" fill="#111827">1</text><path d="M545 160v4" stroke="#111827"/><text x="545" y="177" font-size="11" text-anchor="middle" fill="#111827">2</text><path d="M746 160v4" stroke="#111827"/><text x="746" y="177" font-size="11" text-anchor="middle" fill="#111827">5</text><clipPath id="c20"><rect x="40" y="70" width="740" height="90"/></clipPath><path d="M40 128H780" stroke="#111827" stroke-width="1.4"/><text x="74" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 5</text><path d="M74 133V122" stroke="#6b7280" stroke-width="1"/><text x="141" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 5</text><path d="M141 133V122" stroke="#6b7280" stroke-width="1"/><text x="208" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 4</text><path d="M208 133V122" stroke="#6b7280" stroke-width="1"/><text x="275" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 3</text><path d="M275 133V122" stroke="#6b7280" stroke-width="1"/><text x="343" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 3</text><path d="M343 133V122" stroke="#6b7280" stroke-width="1"/><text x="410" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 2</text><path d="M410 133V122" stroke="#6b7280" stroke-width="1"/><text x="477" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 1</text><path d="M477 133V122" stroke="#6b7280" stroke-width="1"/><text x="545" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 0</text><path d="M545 133V122" stroke="#6b7280" stroke-width="1"/><text x="746" y="95" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">V = 0</text><path d="M746 133V122" stroke="#6b7280" stroke-width="1"/><circle cx="153" cy="128" r="5.5" fill="#dc2626"/><circle cx="241" cy="128" r="5.5" fill="#dc2626"/><circle cx="362" cy="128" r="5.5" fill="#dc2626"/><circle cx="420" cy="128" r="5.5" fill="#dc2626"/><circle cx="537" cy="128" r="5.5" fill="#dc2626"/><path d="M147 149H202" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M214 149H269" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M349 149H404" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M416 149H471" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M483 149H539" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><text x="410" y="205" font-size="12" text-anchor="middle" fill="#6b7280">V(x) = sign changes down the Sturm sequence at x. V drops by 1 exactly when x passes a real root,</text><text x="410" y="222" font-size="12" text-anchor="middle" fill="#6b7280">so V(a) − V(b) = number of real 
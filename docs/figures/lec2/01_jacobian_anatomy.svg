<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="430" y="26" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="bold">Anatomy of the arm system J·θ̇ = v  (shoulder 90°, elbow −90°)</text><rect x="158" y="230" width="24" height="7" rx="2" fill="none" stroke="#6b7280"/><path d="M170 230L170.0 120.0L280.0 120.0" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170.0" cy="120.0" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><path d="M280.0 120.0L210.0 50.0M213.2 59.5L210.0 50.0L219.5 53.2" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="42" font-size="11.5" text-anchor="end" fill="#2563eb" font-weight="bold">column 1 = (−1, 1)</text><text x="202" y="58" font-size="10.5" text-anchor="end" fill="#6b7280">what the shoulder does</text><path d="M280.0 120.0L280.0 35.0M275.5 44.0L280.0 35.0L284.5 44.0" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="40" font-size="11.5" text-anchor="start" fill="#dc2626" font-weight="bold">column 2 = (0, 1)</text><text x="288" y="56" font-size="10.5" text-anchor="start" fill="#6b7280">what the elbow does</text><path d="M280.0 120.0L355.0 120.0M346.0 115.5L355.0 120.0L346.0 124.5" stroke="#BA7517" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="334" y="140" font-size="11.5" text-anchor="middle" fill="#BA7517" font-weight="bold">goal v = (0.5, 0)</text><text x="225" y="190" font-size="10.5" text-anchor="middle" fill="#6b7280">shoulder</text><text x="225" y="108" font-size="10.5" text-anchor="middle" fill="#6b7280">elbow</text><text x="290" y="160" font-size="10.5" text-anchor="middle" fill="#6b7280">hand</text><text x="630" y="90" font-size="12" text-anchor="middle" fill="#6b7280">joints → columns   ·   hand rules → rows</text><text x="510" y="130" font-size="11.5" text-anchor="end" fill="#6b7280">hand x rule →</text><text x="550" y="130" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">−1</text><text x="595" y="130" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">0</text><text x="655" y="130" font-size="15" text-anchor="middle" fill="#111827">θ̇₁</text><text x="718" y="130" font-size="15" text-anchor="middle" fill="#111827">=</text><text x="760" y="130" font-size="15" text-anchor="middle" fill="#BA7517" font-weight="bold">0.5</text><text x="510" y="164" font-size="11.5" text-anchor="end" fill="#6b7280">hand y rule →</text><text x="550" y="164" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">1</text><text x="595" y="164" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">1</text><text x="655" y="164" font-size="15" text-anchor="middle" fill="#111827">θ̇₂</text><text x="718" y="164" font-size="15" text-anchor="middle" fill="#111827">=</text><text x="760" y="164" font-size="15" text-anchor="middle" fill="#BA7517" font-weight="bold">0</text><path d="M528 108V172" stroke="#111827" stroke-width="1.3" fill="none"/><path d="M618 108V172" stroke="#111827" stroke-width="1.3" fill="none"/><path d="M638 108V172" stroke="#111827" stroke-width="1.3" fill="none"/><path d="M675 108V172" stroke="#111827" stroke-width="1.3" fill="none"/><path d="M742 108V172" stroke="#111827" stroke-width="1.3" fill="none"/><path d="M780 108V172" stroke="#111827" stroke-width="1.3" fill="none"/><text x="550" y="200" font-size="10.5" text-anchor="middle" fill="#2563eb">shoulder</text><text x="598" y="200" font-size="10.5" text-anchor="middle" fill="#dc2626">elbow</text><text x="630" y="250" font-size="11.5" text-anchor="middle" fill="#111827">solution x = (−0.5, 0.5):  swing the shoulder back, bend the elbow forward,</text><text x="630" y="268" font-size="11.5" text-anchor="middle" fill="#111827">their vertical parts cancel and the hand slides right at 0.5. Verified.</text><text x="430" y="330" font-size="11.5" text-anchor="middle" fill="#6b7280">People expect rows = joints. It's the other way: each COLUMN is a joint's effect on the hand; each ROW is one rule about a hand direction.</text></svg>
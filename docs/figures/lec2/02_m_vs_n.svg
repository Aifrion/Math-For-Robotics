<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="160" y="60" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">m &lt; n: 3 joints, 2 rules </text><text x="160" y="78" font-size="11.5" text-anchor="middle" fill="#16a34a">— choices left over</text><text x="440" y="60" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">m = n: 2 joints, 2 rules </text><text x="440" y="78" font-size="11.5" text-anchor="middle" fill="#2563eb">— one answer</text><text x="720" y="60" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">m &gt; n: 1 joint, 2 rules </text><text x="720" y="78" font-size="11.5" text-anchor="middle" fill="#dc2626">— can't satisfy both</text><rect x="88" y="265" width="24" height="7" rx="2" fill="none" stroke="#6b7280"/><path d="M100.0 265.0L119.5 206.2L177.8 184.9L233.6 211.9" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="119.5" cy="206.2" r="3.5" fill="none" stroke="#111827" stroke-width="1.3"/><circle cx="177.8" cy="184.9" r="3.5" fill="none" stroke="#111827" stroke-width="1.3"/><path d="M100.0 265.0L154.4 235.3L180.9 179.2L233.6 211.9" stroke="#6b7280" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><circle cx="154.4" cy="235.3" r="3.5" fill="none" stroke="#6b7280" stroke-width="1.3"/><circle cx="180.9" cy="179.2" r="3.5" fill="none" stroke="#6b7280" stroke-width="1.3"/><circle cx="233.6" cy="211.9" r="7" fill="#BA7517"/><text x="246" y="204" font-size="10.5" text-anchor="start" fill="#6b7280">same hand, two poses</text><rect x="368" y="265" width="24" height="7" rx="2" fill="none" stroke="#6b7280"/><path d="M380.0 265.0L415.1 186.5L501.0 182.2" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="415.1" cy="186.5" r="3.5" fill="none" stroke="#111827" stroke-width="1.3"/><circle cx="501.0" cy="182.2" r="7" fill="#BA7517"/><text x="513" y="176" font-size="10.5" text-anchor="start" fill="#6b7280">exactly one pose</text><rect x="638" y="265" width="24" height="7" rx="2" fill="none" stroke="#6b7280"/><path d="M650.0 265.0L724.6 171.0" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="130" r="7" fill="#BA7517"/><path d="M724.6 171.0L800 130" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/><text x="772" y="151" font-size="10.5" text-anchor="start" fill="#dc2626">least-squares gap</text><path d="M770 265 A120 120 0 0 0 630 146.7" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 4" fill="none"/><text x="430" y="318" font-size="11" text-anchor="middle" fill="#6b7280">m counts rules, n counts joints. m &lt; n: a null space of free motion. m = n: unique solve. m &gt; n: no exact solution — fit by least squares (the robot-calibration regime).</text></svg>
">[F_y − d/dx F_y′]</text><text x="572" y="130" font-size="12" text-anchor="start" fill="#2563eb">  + λ₀[G_y − d/dx G_y′] = 0</text><text x="572" y="162" font-size="12" text-anchor="start" fill="#111827">solution: a circle arc with</text><text x="572" y="186" font-size="12.5" text-anchor="start" fill="#16a34a" font-weight="bold">radius 1/λ₀ = 0.512</text><text x="572" y="214" font-size="11.5" text-anchor="start" fill="#6b7280">λ₀ recovered from the</text><text x="572" y="231" font-size="11.5" text-anchor="start" fill="#6b7280">optimized curve: 1.962</text><text x="572" y="248" font-size="11.5" text-anchor="start" fill="#6b7280">1/R = 1.953 ✓</text><text x="430" y="338" font-size="11.5" text-anchor="middle" fill="#6b7280">Three curves with the same area: the constraint multiplier λ₀ turns out to be the curve's curvature — tension against the constraint, made geometric.</text></svg>
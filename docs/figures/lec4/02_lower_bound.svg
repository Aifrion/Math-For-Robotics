59 124 407 100 525 40" stroke="#6b7280" stroke-width="1.6" fill="none" stroke-dasharray="5 4" clip-path="url(#c24)"/><path d="M55 299L75 289 79 288 173 240 525 64" stroke="#16a34a" stroke-width="2.4" fill="none" clip-path="url(#c24)"/><circle cx="86" cy="260" r="5.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.6"/><circle cx="290" cy="205" r="5.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.6"/><circle cx="494" cy="56" r="5.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.6"/><path d="M290 205V158" stroke="#dc2626" stroke-width="1.8"/><text x="298" y="182" font-size="11.5" text-anchor="start" fill="#dc2626" font-weight="bold">gap = 0.5431</text><text x="137" y="223" font-size="10.5" text-anchor="start" fill="#6b7280">chord through the outer points</text><text x="382" y="160" font-size="10.5" text-anchor="start" fill="#16a34a">best you can do: split the gap</text><text x="280" y="322" font-size="12" text-anchor="middle" fill="#6b7280">A line can't bend, so it must miss at least one of the 3 points by ≥ gap / 2 = 0.2715.</text><text x="280" y="340" font-size="12" text-anchor="middle" fill="#6b7280">That's exactly the slide's lower bound (f(−1) − 2f(0) + f(1)) / 4.</text></svg>